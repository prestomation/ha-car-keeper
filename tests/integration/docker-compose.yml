services:
  homeassistant:
    # HA_TAG selects the Home Assistant version. It defaults to `stable`, so e2e,
    # integration and the walkthrough capture keep testing what users actually run.
    # The nightly `ha-beta.yml` workflow sets `beta` — that's the early warning that
    # a breaking change is inbound, roughly four weeks before it reaches users.
    image: ghcr.io/home-assistant/home-assistant:${HA_TAG:-stable}
    ports:
      - "8123:8123"
    volumes:
      # HA_CONFIG points at the config dir. The default is the committed fixture.
      # ci/test-noise.sh sets a temporary copy.
      - ${HA_CONFIG:-./ha_config}:/config
      # Each component is its own mount, so the real Home Keeper from
      # ci/fetch-home-keeper.sh sits next to Car Keeper.
      - ../../custom_components/car_keeper:/config/custom_components/car_keeper:ro
      - ./.home_keeper/custom_components/home_keeper:/config/custom_components/home_keeper:ro
    environment:
      - TZ=America/New_York
      # Python dev mode and asyncio debug mode make Home Assistant log problems
      # that stay silent otherwise: a coroutine that nobody awaited, a slow
      # callback, an unclosed resource. ci/check-ha-log.py reads them from the log.
      # CK_DEVMODE= (empty) turns both off. Every lane keeps them on.
      - PYTHONDEVMODE=${CK_DEVMODE-1}
      - PYTHONASYNCIODEBUG=${CK_DEVMODE-1}
    tmpfs:
      - /tmp
