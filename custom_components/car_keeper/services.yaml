add_car:
  fields:
    name:
      required: true
      selector:
        text:
    make:
      required: false
      selector:
        text:
    model:
      required: false
      selector:
        text:
    year:
      required: false
      selector:
        number:
          min: 1886
          max: 2200
          mode: box
    trim:
      required: false
      selector:
        text:
    fuel:
      required: false
      selector:
        select:
          options:
            - "petrol"
            - "diesel"
            - "hybrid"
            - "plug_in_hybrid"
            - "electric"
            - "other"
          translation_key: fuel
    vin:
      required: false
      selector:
        text:
    plate:
      required: false
      selector:
        text:
    area_id:
      required: false
      selector:
        area:
    notes:
      required: false
      selector:
        text:
          multiline: true
    lead_distance:
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    lead_days:
      required: false
      selector:
        number:
          min: 0
          max: 365
          mode: box
    unit:
      required: false
      selector:
        select:
          options:
            - "km"
            - "mi"
          translation_key: unit
    odometer_source:
      required: false
      selector:
        select:
          options:
            - "manual"
            - "entity"
          translation_key: odometer_source
    odometer_entity_id:
      required: false
      selector:
        entity:
          domain: sensor
    odometer:
      required: false
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
    starter_jobs:
      required: false
      selector:
        object:
    due_dates:
      required: false
      selector:
        object:

